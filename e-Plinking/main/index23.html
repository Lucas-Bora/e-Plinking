<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador AP ESP-IDF</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        .contador { font-size: 80px; font-weight: bold; color: #28a745; margin: 20px 0; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; transition: 0.3s; }
        .btn:hover { opacity: 0.8; }
        .btn-danger { background-color: #dc3545; }
    </style>
    <script>
        function atualizarContador() {
            fetch('/valor')
                .then(response => response.text())
                .then(data => { document.getElementById('numero').innerText = data; })
                .catch(error => console.error('Erro:', error));
        }
        function zerarContador() {
            fetch('/reset', { method: 'POST' })
                .then(response => { if(response.ok) atualizarContador(); });
        }
        setInterval(atualizarContador, 500);
    </script>
</head>
<body>
    <header>
        <div class="card">
            <h1>Contador (Modo AP)</h1>
            <p>Disparos registrados no GPIO 4 (Nível Baixo):</p>
            <div class="contador" id="numero">0</div>
            <button class="btn btn-danger" onclick="zerarContador()">Zerar Contador</button>
            <br>
            <a href="/ConfigPage"><button class="btn">Ir para Página 2</button></a>
        </div>
    </header>
    
    
    <footer>
        <p>By: Lucas Bora</p>
    </footer>
    
    


    
</body>
</html>
