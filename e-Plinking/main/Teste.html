        body {
            background-color: #2d2b2b;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
            color: #39af21;
        }

        h3 {
            text-align: center;
            color: #39af21;
        }

        header {
            background-color: #353434;
            width: calc(100% - 20px);
            max-height: 60px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-sizing: border-box;
            border: 2px dashed #7b7979;
            border-radius: 10px;
            box-shadow: 0 8px 38px rgba(0, 0, 0, 0.2);
        }

        footer {
            background-color: #353434;
            width: calc(100% - 20px);
            height: 50px;
            margin: 20px auto;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            border: 2px solid #7b7979;
            border-radius: 10px;
            box-shadow: 0 8px 38px rgba(0, 0, 0, 0.2);
        }

        svg {
            width: 500px;
            height: auto;
        }

        .top-itens {
            width: calc(100% - 40px);
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin-top: 20px;
            font-family: 'DigitaldreamFatSkew';
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo-header {
            height: 150px;
            width: auto;
            object-fit: contain;
        }

        .header-logo {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .header-titulo {
            color: #39af21;
            width: 100%;
            font-size: 22px;
            font-weight: bold;
        }

        .container-score-counter {
            width: 584px;
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
            margin-bottom: 5px;
        }

        .card-score-counter {
            background-color: #373839;
            border: 2px solid #7b7979;
            border-radius: 10px;
            min-width: 250px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            margin-top: 5px;
            margin-bottom: 5px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .title-score-counter {
            font-size: 40px;
            text-align: center;
            vertical-align: top;
            margin-bottom: 30px;
            font-family: 'DigitaldreamFatSkew';
            color: rgb(234, 41, 16);
            padding-top: 20px;
        }

        .value-score-counter {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: top;
            font-size: 90px;
            font-family: 'DigitaldreamFatSkew';
            color: rgb(234, 41, 16);
        }

        .folha-alvo {

            width: 584px;
            box-sizing: border-box;
            background-color: #373839;
            padding: 40px;
            box-shadow: 0 50px 30px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
            margin-top: 20px;
            justify-content: center;
            box-sizing: border-box;
            border: 2px dashed #7b7979;
            border-radius: 10px;
            box-shadow: 0 8px 38px rgba(0, 0, 0, 0.2);
        }

        .zona {
            fill: none;
            stroke: #39af21;
            stroke-width: 5;
            transition: fill 0.001s ease;
            fill-rule: evenodd;
        }

        .-container-btn-ações {

            width: 584px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 20px;

        }

        .btn-acao {
            background-color: #373839;
            min-width: 220px;
            min-height: 80px;
            padding: 10px;
            cursor: pointer;
            border: 2px solid;
            border-radius: 5px;
            font-family: 'DigitaldreamFatSkew';
            font-size: 30px;
        }

        .container-results {
            min-width: 580;
            min-height: 35;
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: center;
        }

        .shot-table {
            width: calc(130%);
            margin-bottom: 25px;
            text-align: center;
            border-spacing: 10px 8px;
        }

        .shot-table th {
            color: rgb(28, 177, 226);
            height: 70px;
            font-size: 30px;
            text-align: center;
            border: 1px solid rgb(28, 177, 226);
        }

        .shot-table td {
            color: rgb(234, 41, 16);
            height: 50px;
            font-size: 45px;
            text-align: center;
            border: 2px dashed #7b7979;
            padding-top: 5px;
        }
    </style>
</head>

<script>

    // ==============================
    // Variáveis
    // ==============================

    let ws;

    const txtDisparos = document.getElementById("disparos");
    const txtPontuacao = document.getElementById("pontuacao");

    const btnIniciar = document.getElementById("btnIniciar");
    const btnParar = document.getElementById("btnParar");
    const btnLimpar = document.getElementById("btnLimpar");


    // ==============================
    // Conexão WebSocket
    // ==============================

    function conectarWebSocket() {
        ws = new WebSocket("ws://" + location.host + "/ws");

        ws.onopen = function () {
            console.log("WebSocket conectado");
        };

        ws.onmessage = function (event) {
            tratarPacote(event.data);
        };

        ws.onclose = function () {
            console.log("WebSocket desconectado");

            setTimeout(function () {
                conectarWebSocket();
            }, 1000);
        };

        ws.onerror = function (erro) {
            console.log("Erro no WebSocket:", erro);
        };
    }


    // ==============================
    // Tratamento do pacote recebido
    // ==============================

    function tratarPacote(pacote) {
        /*
            Protocolo:

            STX B1 B2 B3 B4 B5 B6 B7 ETX

            STX = 0x02
            B1  = 4 caracteres - disparos geral
            B2  = 4 caracteres - pontuação geral
            B3  = 1 caractere  - linha da tabela
            B4  = 8 caracteres - tempo de reação
            B5  = 4 caracteres - disparos da tabela
            B6  = 8 caracteres - tempo médio
            B7  = 5 caracteres - pontuação da tabela
            ETX = 0x03
        */

        if (pacote.length !== 36) {
            console.log("Pacote com tamanho inválido:", pacote.length);
            return;
        }

        if (pacote.charCodeAt(0) !== 2) {
            console.log("STX inválido");
            return;
        }

        if (pacote.charCodeAt(35) !== 3) {
            console.log("ETX inválido");
            return;
        }

        const dados = pacote.substring(1, 35);


        // ===================================================================
        // Faz o parse dos dados recebidos e atualiza os elementos da página
        // ===================================================================
        const b1 = dados.substring(0, 4);
        const b2 = dados.substring(4, 8);
        const b3 = dados.substring(8, 9);
        const b4 = dados.substring(9, 17);
        const b5 = dados.substring(17, 21);
        const b6 = dados.substring(21, 29);
        const b7 = dados.substring(29, 34);

        txtDisparos.innerText = b1;
        txtPontuacao.innerText = b2;

        // ===================================================================
        // Faz o parse dos dados recebidos e atualiza os elementos da página
        // ===================================================================

        if (b3 !== "0") {
            piscarZona(b3);
        }

        atualizarLinhaTabela(b3, b4, b5, b6, b7);
    }


    // ==============================
    // Atualiza linha da tabela
    // ==============================

    function atualizarLinhaTabela(linha, tempoReacao, disparos, tempoMedio, pontuacao) {
        document.getElementById("reacao" + linha).innerText = tempoReacao;
        document.getElementById("disparos" + linha).innerText = disparos;
        document.getElementById("medio" + linha).innerText = tempoMedio;
        document.getElementById("pontos" + linha).innerText = pontuacao;
    }


    // ==============================
    // Envio de comandos ao ESP32
    // ==============================

    function enviarComando(comando) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(comando);
        } else {
            console.log("WebSocket não conectado");
        }
    }


    // ==============================
    // Botões
    // ==============================

    btnIniciar.onclick = function () {
        enviarComando("INICIAR");
    };

    btnParar.onclick = function () {
        enviarComando("PARAR");
    };

    btnLimpar.onclick = function () {
        enviarComando("LIMPAR");
    };


    // ==============================
    // Inicia conexão
    // ==============================

    conectarWebSocket();

    function piscarZona(zona) {
        const mapaZonas = {
            "1": "zona-a",
            "2": "zona-c",
            "3": "zona-d"
        };

        const elemento = document.getElementById(mapaZonas[zona]);

        if (!elemento) return;

        elemento.style.fill = "red";

        setTimeout(() => elemento.style.fill = "none", 150);
    }
</script>

</html>
